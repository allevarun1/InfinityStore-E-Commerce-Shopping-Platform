# Rekha Shopping Mall API on one server (Oracle Cloud Always Free Arm VM, or any Linux VPS with Docker).
#
#   Phase A (database stays on Aiven):  COMPOSE_FILE=docker-compose.yml                              in .env
#   Phase B (MySQL on this server):     COMPOSE_FILE=docker-compose.yml:docker-compose.localdb.yml   in .env
#
# Docker Compose reads COMPOSE_FILE from .env, so plain `docker compose ...` always uses the right files.
# First start: ./setup-server.sh, edit .env, then ./deploy.sh --force. See docs/DEPLOY_ORACLE.md.
name: rekha

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build: ../../ecommerce-backend
    image: rekha-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
    # The API and its scheduler run in UTC, exactly as on Render (do not set TZ here: stored times would shift).
    mem_limit: 3g
    expose:
      - "8080"
    healthcheck:
      # Tomcat opens the port only after Spring has finished starting.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 180s
    logging: *logging

  caddy:
    # Free HTTPS: fetches and renews the certificate for API_DOMAIN by itself (needs ports 80 and 443 open).
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
    mem_limit: 256m
    logging: *logging

volumes:
  caddydata:
  caddyconfig:
