# Keeps the shop awake, and doubles as a free uptime check (a failed run emails the repository owner). Render's free server sleeps after 15 idle minutes and Aiven's free MySQL can be powered off
# when idle; loading the saree list every 10 minutes keeps both running, so the site never opens empty or slow.
# Free for public repositories. GitHub may delay scheduled runs by a few minutes; that is fine here.
name: Keep shop awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load sarees from the live API (wakes the server and touches the database)
        env:
          # Repository variable API_URL (e.g. https://api.<domain>/api) once the API moves to Oracle.
          API_URL: ${{ vars.API_URL || 'https://api.rekhashoppingmall.com/api' }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s --max-time 90 -A "keep-shop-awake/1.0 (GitHub Actions)" -o /tmp/products.json -w '%{http_code}' "$API_URL/products" || echo "000")
            count=$(python3 -c "import json; print(len(json.load(open('/tmp/products.json'))))" 2>/dev/null || echo "")
            if [ -z "$count" ]; then echo "HTTP $code from $API_URL/products, reply starts: $(head -c 200 /tmp/products.json 2>/dev/null | tr '\n' ' ')"; fi
            if [ -n "$count" ]; then
              echo "Shop is up: $count sarees"
              if [ "$count" = "0" ]; then echo "::warning::The shop returned 0 sarees"; fi
              exit 0
            fi
            echo "No answer yet (attempt $attempt), retrying"
            sleep 20
          done
          echo "::error::The shop API did not answer"
          exit 1
