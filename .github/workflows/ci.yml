name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and test
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ecommerce-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Reports known vulnerabilities in production dependencies. Non-blocking until the
      # existing advisories are cleared; make it blocking afterwards.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
