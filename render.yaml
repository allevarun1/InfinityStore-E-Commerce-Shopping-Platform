# Render Blueprint: Rekha Shopping Mall demo API on the free plan.
# DEMO ONLY: the free plan has no database and no disk, so the catalogue lives in memory and resets whenever the
# service restarts or wakes from sleep. For a real store, create a MySQL database elsewhere and set DB_URL, DB_USERNAME,
# DB_PASSWORD (remove SPRING_DATASOURCE_DRIVERCLASSNAME), and SEED_DEMO_CATALOG=false.
services:
  - type: web
    name: rekha-shopping-mall-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./ecommerce-backend
    dockerfilePath: ./ecommerce-backend/Dockerfile
    healthCheckPath: /api/store/info
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_URL
        value: jdbc:h2:mem:rekha;MODE=MySQL;DB_CLOSE_DELAY=-1
      - key: DB_USERNAME
        value: sa
      - key: DB_PASSWORD
        value: rekhademo
      - key: SPRING_DATASOURCE_DRIVERCLASSNAME
        value: org.h2.Driver
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SEED_DEMO_CATALOG
        value: "true"
      - key: CORS_ORIGINS
        value: https://rekha-shopping-mall.onrender.com
      - key: FRONTEND_URL
        value: https://rekha-shopping-mall.onrender.com
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1

  # The storefront: static files built from ecommerce-frontend and served from Render's CDN (free).
  - type: web
    name: rekha-shopping-mall
    runtime: static
    rootDir: ecommerce-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://rekha-shopping-mall-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; frame-src https://www.youtube-nocookie.com; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
