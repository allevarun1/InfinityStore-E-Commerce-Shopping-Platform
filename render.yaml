# Render Blueprint: Rekha Shopping Mall API on the free plan.
# The free plan has no disk, so the catalogue lives in an external MySQL database. DB_URL, DB_USERNAME and DB_PASSWORD
# are set in the Render dashboard (sync: false keeps them out of git and stops a Blueprint sync overwriting them).
# DB_URL looks like jdbc:mysql://HOST:PORT/DBNAME?sslMode=REQUIRED
services:
  - type: web
    name: rekha-shopping-mall-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./ecommerce-backend
    dockerfilePath: ./ecommerce-backend/Dockerfile
    healthCheckPath: /api/store/info
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Aiven personal token (secret): lets the API switch the free database back on when Aiven powers it off.
      - key: AIVEN_API_TOKEN
        sync: false
      # Login with mobile number + OTP: from Firebase console > Project settings > Your apps (web). Public values.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      # On hold: Firebase sends OTP SMS only on its paid Blaze plan. Set to "true" once billing is enabled there.
      - key: PHONE_LOGIN_ENABLED
        value: "false"
      # Quick sign-in. GOOGLE_CLIENT_ID and TRUECALLER_APP_KEY are public; WHATSAPP_TOKEN is a secret.
      - key: GOOGLE_CLIENT_ID
        value: 1095864064515-vqa19ftl6s24kuih70g2tan8n7a9u3bu.apps.googleusercontent.com
      - key: TRUECALLER_APP_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Paid-order alerts on the phone: the owner's WhatsApp number(s), comma separated, and an email that also gets
      # each new paid order (the email needs MAIL_USERNAME / MAIL_PASSWORD). See docs/WHATSAPP_ORDER_ALERTS.md.
      - key: ORDER_ALERT_WHATSAPP
        sync: false
      - key: ORDER_ALERT_EMAIL
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # Photos and videos uploaded in admin go to Cloudflare R2 (10 GB free) so the 1 GB database stays small.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Online payments: set PAYMENT_PROVIDER=razorpay and the three Razorpay values in the dashboard.
      - key: PAYMENT_PROVIDER
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      # Loads the 19 built-in sarees, their reels and the welcome offer, only while the database has no categories,
      # so it never duplicates or overwrites sarees added in admin.
      # Delivery: no free shipping, a flat Rs 99 on every order.
      - key: FREE_SHIPPING_THRESHOLD
        value: "0"
      - key: SHIPPING_FEE
        value: "99"
      # No cash on delivery: every order is prepaid online through Razorpay.
      - key: COD_ENABLED
        value: "false"
      - key: SEED_DEMO_CATALOG
        value: "true"
      - key: CORS_ORIGINS
        value: https://rekhashoppingmall.com,https://www.rekhashoppingmall.com,https://rekha-shopping-mall.pages.dev,https://rekha-shopping-mall.onrender.com
      - key: FRONTEND_URL
        value: https://rekhashoppingmall.com
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1

  # The storefront: static files built from ecommerce-frontend and served from Render's CDN (free).
  - type: web
    name: rekha-shopping-mall
    runtime: static
    rootDir: ecommerce-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://rekha-shopping-mall-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://connect.facebook.net https://www.google.com https://www.gstatic.com https://apis.google.com https://checkout.razorpay.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; frame-src https://www.youtube-nocookie.com https://www.google.com https://*.firebaseapp.com https://api.razorpay.com https://checkout.razorpay.com https://accounts.google.com; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
