# Render Blueprint: Rekha Shopping Mall API on the free plan.
# The free plan has no disk, so the catalogue lives in an external MySQL database. DB_URL, DB_USERNAME and DB_PASSWORD
# are set in the Render dashboard (sync: false keeps them out of git and stops a Blueprint sync overwriting them).
# DB_URL looks like jdbc:mysql://HOST:PORT/DBNAME?sslMode=REQUIRED
services:
  - type: web
    name: rekha-shopping-mall-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./ecommerce-backend
    dockerfilePath: ./ecommerce-backend/Dockerfile
    healthCheckPath: /api/store/info
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Login with mobile number + OTP: from Firebase console > Project settings > Your apps (web). Public values.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      # On hold: Firebase sends OTP SMS only on its paid Blaze plan. Set to "true" once billing is enabled there.
      - key: PHONE_LOGIN_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SEED_DEMO_CATALOG
        value: "false"
      - key: CORS_ORIGINS
        value: https://rekha-shopping-mall.pages.dev,https://rekha-shopping-mall.onrender.com
      - key: FRONTEND_URL
        value: https://rekha-shopping-mall.pages.dev
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1

  # The storefront: static files built from ecommerce-frontend and served from Render's CDN (free).
  - type: web
    name: rekha-shopping-mall
    runtime: static
    rootDir: ecommerce-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://rekha-shopping-mall-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://connect.facebook.net https://www.google.com https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; frame-src https://www.youtube-nocookie.com https://www.google.com https://*.firebaseapp.com; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
