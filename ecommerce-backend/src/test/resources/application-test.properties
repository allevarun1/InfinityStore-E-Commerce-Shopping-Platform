app.env=dev
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-only-jwt-secret-0123456789abcdef0123456789
app.cors.allowed-origins=http://localhost:*
app.frontend-url=http://localhost:4200
app.seed.admin.username=admin
app.seed.admin.email=admin@test.local
app.seed.admin.password=test-admin-password
app.seed.customer.password=
app.payment.provider=none
app.ratelimit.multiplier=1000
