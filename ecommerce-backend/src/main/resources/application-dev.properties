# LOCAL DEVELOPMENT ONLY. Activate with SPRING_PROFILES_ACTIVE=dev.
# Never deploy with this profile: it contains a throw-away JWT secret and weak seed passwords.
app.env=dev

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-not-for-production-0123456789abcdef}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

app.seed.admin.password=${ADMIN_PASSWORD:admin123}
app.seed.customer.password=${CUSTOMER_PASSWORD:customer123}

# Exercise checkout without a payment provider. Test payments are flagged and never count as sales.
app.payment.provider=${PAYMENT_PROVIDER:test}
app.seed.demo-catalog=${SEED_DEMO_CATALOG:true}
