# ---------------------------------------------------------------------------
# Base configuration. Secrets and environment-specific values have NO insecure
# defaults here: a deployment must supply them (see /.env.example). For local
# development run with SPRING_PROFILES_ACTIVE=dev (see application-dev.properties).
# ---------------------------------------------------------------------------

# "production" unless explicitly set to dev. Production start-up fails if required
# configuration is missing or weak (see StartupConfigValidator).
app.env=${APP_ENV:production}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate. Schema is still managed by Hibernate "update" until Flyway migrations
# are introduced (planned: baseline against a reviewed copy of production).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Load related rows (products of cart lines, items of orders...) in one query instead of one per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Login with mobile number + OTP (Firebase Phone Auth). Off unless both are set; the values come from the Firebase
# console (Project settings > General > Web app) and are public, not secrets. AUTH_DOMAIN defaults to <project>.firebaseapp.com.
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.api-key=${FIREBASE_API_KEY:}
app.firebase.auth-domain=${FIREBASE_AUTH_DOMAIN:}
# Firebase sends OTP SMS only on its paid Blaze plan; set PHONE_LOGIN_ENABLED=true once billing is on.
app.firebase.phone-login-enabled=${PHONE_LOGIN_ENABLED:false}

# Continue with Google: OAuth client ID (Web application) from Google Cloud console > APIs & Services > Credentials.
# Public, not a secret. Authorised JavaScript origin: https://rekha-shopping-mall.pages.dev
app.google.client-id=${GOOGLE_CLIENT_ID:}
# Truecaller one-tap (Android + Truecaller app): app key from developer.truecaller.com (public, sent to the phone).
# Callback URL to register there: https://rekha-shopping-mall-api.onrender.com/api/auth/truecaller/callback
app.truecaller.app-key=${TRUECALLER_APP_KEY:}
app.truecaller.app-name=${TRUECALLER_APP_NAME:Rekha Shopping Mall}
# WhatsApp OTP (Meta WhatsApp Cloud API): permanent access token (secret), phone number ID, and an approved
# "authentication" template with a copy-code button.
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.otp-template=${WHATSAPP_OTP_TEMPLATE:login_otp}
app.whatsapp.otp-language=${WHATSAPP_OTP_LANGUAGE:en}
# Paid-order WhatsApp messages (same WhatsApp sender as above). ORDER_ALERT_WHATSAPP: the owner's number(s) that get
# the alert, comma separated (defaults to STORE_WHATSAPP). Templates must be approved in Meta: see docs/WHATSAPP_ORDER_ALERTS.md.
app.whatsapp.order-alert-to=${ORDER_ALERT_WHATSAPP:${STORE_WHATSAPP:}}
app.whatsapp.notify-owner=${WHATSAPP_NOTIFY_OWNER:true}
app.whatsapp.notify-customer=${WHATSAPP_NOTIFY_CUSTOMER:false}
app.whatsapp.owner-template=${WHATSAPP_OWNER_TEMPLATE:new_order_alert}
app.whatsapp.customer-template=${WHATSAPP_CUSTOMER_TEMPLATE:order_confirmed}
app.whatsapp.order-language=${WHATSAPP_ORDER_LANGUAGE:en}
# Phone notifications (Web Push). The signing key is created automatically and kept in the database;
# set both of these only to use your own key (base64url, as made by any web-push tool).
app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.subject=${VAPID_SUBJECT:mailto:orders@rekhashoppingmall.in}
# Owner email for every new paid order (needs MAIL_USERNAME / MAIL_PASSWORD below). Defaults to the support email.
app.order-alert-email=${ORDER_ALERT_EMAIL:${STORE_SUPPORT_EMAIL:}}

# Server
server.port=${PORT:8080}
# Behind Railway's proxy: use the real client address for rate limiting
server.forward-headers-strategy=native

# CORS - comma separated browser origins allowed to call the API (required in production)
app.cors.allowed-origins=${CORS_ORIGINS:}

# Public URL of the storefront, used in emailed links. Falls back to the first CORS origin.
app.frontend-url=${FRONTEND_URL:}

# Seed accounts (first boot against an empty database). No defaults: set them explicitly.
app.seed.admin.username=${ADMIN_USERNAME:admin}
app.seed.admin.email=${ADMIN_EMAIL:admin@infinitystore.com}
app.seed.admin.password=${ADMIN_PASSWORD:}
app.seed.customer.username=${CUSTOMER_USERNAME:customer}
app.seed.customer.email=${CUSTOMER_EMAIL:customer@store.com}
app.seed.customer.password=${CUSTOMER_PASSWORD:}
# Sample sarees and categories for local development. Keep false in production.
app.seed.demo-catalog=${SEED_DEMO_CATALOG:false}

# Uploaded photos and videos: Cloudflare R2 when all five are set (otherwise they are kept in the database).
# Cloudflare dashboard > R2: account id, an API token's access key id + secret, and the bucket name. R2_PUBLIC_URL is
# the storefront (e.g. https://rekha-shopping-mall.pages.dev), whose /media/{id}/{checksum} function reads the bucket
# bound as MEDIA. Objects are stored as media/{checksum}.
app.storage.r2.account-id=${R2_ACCOUNT_ID:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.public-url=${R2_PUBLIC_URL:}

# Payments: none (cash on delivery only) | razorpay | test (non-production adapter, refuses to run in production)
app.payment.provider=${PAYMENT_PROVIDER:none}
# Cash on delivery. COD_ENABLED=false removes it everywhere (checkout, messages, stylist); keep it on until online
# payment works, otherwise customers have no way to pay.
app.payment.cod-enabled=${COD_ENABLED:true}
# Razorpay dashboard > Account & Settings > API Keys (rzp_test_... keys = test mode, no real money).
# Webhook secret: the one you type when adding the webhook (Settings > Webhooks) for .../api/payments/razorpay/webhook.
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Pricing (tax-exclusive catalogue prices; confirm GST rates with your accountant)
app.pricing.currency=${PRICING_CURRENCY:INR}
app.pricing.default-gst-percent=${DEFAULT_GST_PERCENT:0}
# 0 = no free shipping: every order pays SHIPPING_FEE.
app.pricing.free-shipping-threshold=${FREE_SHIPPING_THRESHOLD:0}
app.pricing.shipping-fee=${SHIPPING_FEE:99}

# Store contact channels and growth settings (all optional). WhatsApp number in international format
# without "+" (e.g. 919876543210). Analytics ids are public identifiers, not secrets.
app.store.whatsapp=${STORE_WHATSAPP:}
app.store.support-email=${STORE_SUPPORT_EMAIL:}
app.store.support-phone=${STORE_SUPPORT_PHONE:}
app.analytics.ga-measurement-id=${GA_MEASUREMENT_ID:}
app.analytics.meta-pixel-id=${META_PIXEL_ID:}
# Code shown to newsletter subscribers. Create a coupon with this code in Admin > Coupons to enable the offer.
app.growth.welcome-code=${WELCOME_CODE:WELCOME10}

# Delivery estimates by PIN code (first two digits). These are placeholders: ask your courier and set your own.
# Ranges are days in transit after dispatch. Leave blocked/no-cod prefixes empty to deliver and take COD everywhere.
app.delivery.metro-prefixes=${DELIVERY_METRO_PREFIXES:11,30,38,40,41,50,56,60,70}
app.delivery.remote-prefixes=${DELIVERY_REMOTE_PREFIXES:18,19,74,78,79,90}
app.delivery.blocked-prefixes=${DELIVERY_BLOCKED_PREFIXES:}
app.delivery.no-cod-prefixes=${DELIVERY_NO_COD_PREFIXES:}
app.delivery.metro-days=${DELIVERY_METRO_DAYS:3-5}
app.delivery.remote-days=${DELIVERY_REMOTE_DAYS:8-12}
app.delivery.default-days=${DELIVERY_DEFAULT_DAYS:5-8}
app.delivery.dispatch-days=${DELIVERY_DISPATCH_DAYS:1}

# Demand badges ("Bestseller", "Loved") are recomputed from real orders and wishlists this often.
app.signals.ttl-seconds=${SIGNALS_TTL_SECONDS:600}

# Abuse protection
app.ratelimit.multiplier=1
app.login.max-failures=8
app.login.lock-minutes=15
app.reset.token-ttl-minutes=30
app.reset.max-attempts=5

# Email (optional). Use an app password, not a login password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Product Studio. "none" uses the offline template writer. "anthropic" sends only the facts typed into the
# studio form to the Anthropic API and needs ANTHROPIC_API_KEY (a paid service; leave unset to stay offline).
app.ai.provider=${AI_PROVIDER:none}
app.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}
app.studio.target-margin-percent=${STUDIO_TARGET_MARGIN_PERCENT:35}
# Shopping assistant rewording model (only used when AI_PROVIDER=anthropic). Product picks never depend on it.
app.ai.anthropic.assistant-model=${ANTHROPIC_ASSISTANT_MODEL:claude-haiku-5-5}

# Store name used in Autopilot emails and WhatsApp drafts
app.store.name=${STORE_NAME:Rekha Shopping Mall}

# Autopilot: follow-up automations (Admin > Autopilot sets each rule to OFF, PREVIEW or AUTO).
# Runs every 15 minutes. The morning digest goes to DIGEST_EMAIL, or to ADMIN_EMAIL when unset.
app.automation.enabled=${AUTOMATION_ENABLED:true}
app.automation.interval-ms=${AUTOMATION_INTERVAL_MS:900000}
app.automation.digest-to=${DIGEST_EMAIL:${ADMIN_EMAIL:}}
app.automation.zone=${AUTOMATION_ZONE:Asia/Kolkata}
app.automation.digest-hour=${DIGEST_HOUR:8}
app.automation.cart-delay-hours=${CART_REMINDER_DELAY_HOURS:3}

# Compress JSON/text responses (the product list shrinks about 5x on the wire)
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/csv
server.compression.min-response-size=1024

# Owner uploads (photos up to 8 MB, videos up to 20 MB; MediaService enforces the per-type limits)
spring.servlet.multipart.max-file-size=22MB
spring.servlet.multipart.max-request-size=24MB
