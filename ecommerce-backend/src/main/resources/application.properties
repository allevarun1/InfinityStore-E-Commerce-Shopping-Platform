# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Server
server.port=${PORT:8080}

# CORS - browser origins allowed to call this API
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Seed accounts - override in deployment. Defaults are for local development only.
app.seed.admin.username=${ADMIN_USERNAME:admin}
app.seed.admin.email=${ADMIN_EMAIL:admin@infinitystore.com}
app.seed.admin.password=${ADMIN_PASSWORD:admin123}
app.seed.customer.username=${CUSTOMER_USERNAME:customer}
app.seed.customer.email=${CUSTOMER_EMAIL:customer@store.com}
app.seed.customer.password=${CUSTOMER_PASSWORD:customer123}

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true